services:

    db:
      container_name: ASN_DB 
      image: mariadb:11.4.2
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: ${DATABASE_NAME-speciesnet}
        MYSQL_USER: ${DATABASE_USER-mysqluser}
        MYSQL_PASSWORD: ${DATABASE_PASSWORD-unsecure}
        MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD-unsecure}
      expose:
        - ${DATABASE_PORT-3306}
      volumes:
        - asn_data:/var/lib/mysql

    redis:
      container_name: REDIS
      image: redis:7-alpine
      restart: unless-stopped

    # Captures outgoing mail instead of delivering it, with a web UI to view it.
    # Opt-in only (never starts on a plain `docker compose up`) — activate with
    # `COMPOSE_PROFILES=mailpit` in .env, or `docker compose --profile mailpit up -d`.
    # See sample.env for the matching EMAIL_* settings.
    mailpit:
      container_name: MAILPIT
      image: axllent/mailpit
      restart: unless-stopped
      profiles: ["mailpit"]
      ports:
        - ${MAILPIT_WEB_PORT-8025}:8025    # web UI — browse here to view captured emails
      expose:
        - "1025"                           # SMTP — reachable from other containers as 'mailpit:1025'; not published to the host

    django_gunicorn:
      container_name: ASN_DJANGO
      image: gunicorn:23.0.0
      restart: unless-stopped
      tty: true
      depends_on: 
        - db
        - redis
      volumes:
        - static:/static
        - media:/media
      env_file: 
        - ./.env
      build:
        context: .
      ports: 
        - 8000:8000

    celery_worker:
      container_name: CELERY_WORKER
      image: gunicorn:23.0.0
      restart: unless-stopped
      depends_on:
        - db
        - redis
      env_file:
        - ./.env
      entrypoint: []
      command: sh -c "sh /wait-for-db.sh && celery -A speciesnet worker -l info -Q emails,celery,default"

    celery_beat:
      container_name: CELERY_BEAT
      image: gunicorn:23.0.0
      restart: unless-stopped
      depends_on:
        - db
        - redis
      env_file:
        - ./.env
      entrypoint: []
      command: sh -c "sh /wait-for-db.sh && celery -A speciesnet beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

    nginx:
      container_name: NGINX_CBOT
      image: jonasal/nginx-certbot:5.2.1-nginx1.27.0
      depends_on: 
        - django_gunicorn
      restart: unless-stopped
      env_file: 
        - ./.env
      ports:
        - ${HTTP_PORT-80}:80
        - ${HTTPS_PORT-443}:443
      volumes:
        - ./nginx-certbot:/etc/nginx/conf.d/
        - /etc/letsencrypt:/etc/letsencrypt       # change to host mount not Docker managed volume
        - static:/static
        - media:/media

volumes:
  static:
  media:
  asn_data:

