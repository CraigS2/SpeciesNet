{% extends "main.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container mt-4">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="my-0">Register CARES Species: <i>{{ cares_species.name }}</i></h4>
                </div>
                <div class="card-body px-4 py-3" style="background-color: rgb(189, 219, 241);">
                    {% crispy form %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Disable Submit once clicked: the photo upload can take a few seconds, and a second click made a duplicate registration
    document.querySelectorAll('form.registration-form').forEach(function (form) {
        form.addEventListener('submit', function () {
            form.querySelectorAll('input[type="submit"]').forEach(function (button) {
                button.disabled = true;
                button.value = 'Submitting…';
            });
        });
    });
    // Re-enable if the page is shown again from the browser's back/forward cache
    window.addEventListener('pageshow', function (event) {
        if (!event.persisted) { return; }
        document.querySelectorAll('form.registration-form input[type="submit"]').forEach(function (button) {
            button.disabled = false;
            button.value = 'Submit Registration';
        });
    });
</script>

{% endblock %}
