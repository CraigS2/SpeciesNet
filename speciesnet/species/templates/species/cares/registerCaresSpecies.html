{% extends "main.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container mt-4">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="my-0">Register CARES Species: <i>{{ cares_species.name }}</i></h4>
                </div>
                <div class="card-body px-4 py-3" style="background-color: rgb(189, 219, 241);">
                    {% crispy form %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var select = document.getElementById('id_cp_select');
    var newInput = document.getElementById('id_cp_new_text');
    if (!select || !newInput) return;

    function toggleNewInput() {
        var isAdd = (select.value === '__add__');
        newInput.style.display = isAdd ? 'block' : 'none';
        newInput.required = isAdd;
        if (!isAdd) newInput.value = '';
    }

    select.addEventListener('change', toggleNewInput);
    toggleNewInput();
})();
</script>

{% endblock %}
