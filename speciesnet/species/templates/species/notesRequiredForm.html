{% extends 'main.html' %}
{% block content %}
<div class="container">
  <h3>Additional notes required</h3>
  <p>{{ email_context.body }}</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit Notes</button>
  </form>
</div>
{% endblock content %}
