{% extends 'main.html' %}
{% block content %}
<div class="container mt-4">
    <h3>Flush Queued Pending Action Emails</h3>
    <p>There are currently <strong>{{ pending_count }}</strong> pending action(s) awaiting email delivery.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Send All Queued Emails Now</button>
    </form>
</div>
{% endblock content %}
